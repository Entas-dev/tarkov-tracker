name: Update data from wiki

on:
  schedule:
    - cron: '17 4 * * *'   # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['builder/**', 'scripts/build-data.mjs', '.github/workflows/update-data.yml']

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build dataset
        run: node scripts/build-data.mjs
      - name: Commit data
        run: |
          git config user.name "tracker-data-bot"
          git config user.email "tracker-data-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update data from wiki ($(date -u +%F))"
          git pull --rebase
          git push
